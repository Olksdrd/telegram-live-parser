[project]
name = "tgparse"
version = "0.1.0"
description = "Telegram parsers"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "telethon>=1.43.2",
]

[project.scripts]
tgparse = "tgparse.main:main"

[dependency-groups]
mongo = [
    "mongoengine>=0.27.0",
    "pymongo>=4.8.0",
    "telemongo>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"
